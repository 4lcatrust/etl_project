# ==== postgres_fct_transactions_vld.yaml ====
table: fct_transactions
# fct_transactions has no single-column natural key; payment_key is used only for the
# audit table's offending-id sampling, not as a uniqueness guarantee.
primary_key: payment_key

schema:
  - name: payment_key
    type: string
  - name: customer_key
    type: string
  - name: time_key
    type: string
  - name: item_key
    type: string
  - name: store_key
    type: string
  - name: quantity
    type: int32
  - name: unit
    type: string
  - name: unit_price
    type: int32
  - name: total_price
    type: int32

validation_rules:
  - id: not_null_item_key
    rule: not_null
    columns: ["item_key"]

  - id: positive_quantity
    rule: positive_number
    columns: ["quantity"]

  - id: positive_total_price
    rule: positive_number
    columns: ["total_price"]
