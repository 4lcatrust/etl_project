version: 2

models:
  - name: silver_item
    description: Current-state item dimension (deduped from append-only bronze).
    columns:
      - name: item_key
        tests: [not_null, unique]

  - name: silver_time
    description: Current-state time dimension with a derived transaction_date.
    columns:
      - name: time_key
        tests: [not_null, unique]
      - name: transaction_date
        tests: [not_null]

  - name: silver_transactions
    description: Latest full snapshot of the transaction facts.
    columns:
      - name: item_key
        tests:
        - not_null
        - relationships:
            to: ref('silver_item')
            field: item_key
      - name: time_key
        tests:
        - not_null
        - relationships:
            to: ref('silver_time')
            field: time_key

  - name: silver_monthly_sales
    description: Monthly per-item sales rollup from the daily silver tables.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - sales_month
            - item_key
    columns:
      - name: sales_month
        tests: [not_null]
      - name: item_key
        tests: [not_null]

  - name: daily_transaction_summary
    description: Gold datamart — daily transaction summary by date and item category.
    columns:
      - name: transaction_date
        tests: [not_null]
      - name: item_category
        tests: [not_null]

  - name: monthly_transaction_summary
    description: Gold datamart — monthly transaction summary by month and item category.
    columns:
      - name: sales_month
        tests: [not_null]
      - name: item_category
        tests: [not_null]
