# Prometheus scrape config for the opt-in `monitoring` profile.
# Targets are resolved over the compose db_network by service name.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Airflow metrics: the scheduler/worker emit StatsD (when AIRFLOW_STATSD_ON=True) to
  # statsd-exporter, which translates them to Prometheus metrics on :9102.
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # ClickHouse native Prometheus endpoint (clickhouse/config.d/prometheus.xml).
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  # MinIO cluster metrics (requires MINIO_PROMETHEUS_AUTH_TYPE=public on the minio service).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # MinIO per-node/process metrics (CPU, mem, disk, goroutines).
  - job_name: minio-node
    metrics_path: /minio/v2/metrics/node
    static_configs:
      - targets: ["minio:9000"]
