services:
  # DB Sources
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/backup
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - db_network

  # DB Source #2 (MySQL OLTP) — proves multi-source ingestion via the same Scala JAR.
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - db_network

  # DB Sink
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine 
    container_name: clickhouse_db
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/clickhouse-user.xml:/etc/clickhouse-server/users.xml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db_network

  # Storage Layer
  minio:
    image: minio/minio:latest
    container_name: minio
    entrypoint: /bin/bash -c "chmod +x /entrypoint.sh && /entrypoint.sh"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
      - ./minio/minio-init.sh:/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - db_network


  # Spark Master (official image, standalone mode)
  spark-master:
    image: apache/spark:4.0.3-scala2.13-java17-python3-ubuntu
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      # Enable the standalone REST submission server (port 6066) so cluster deploy-mode
      # submissions (Phase B2) return a driver id that SparkSubmitOperator can poll via
      # `spark-submit --status`. spark-class honors SPARK_MASTER_OPTS for the Master class.
      # Local docker network only — the REST server is not exposed beyond the host.
      - SPARK_MASTER_OPTS=-Dspark.master.rest.enabled=true
    ports:
      - "7077:7077"
      - "8000:8080"
      - "6066:6066"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8080), 5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - db_network

  # One-shot: publish the baked bronze-extract + dependency jars from the custom-airflow
  # image into a shared volume so spark-worker-1 (the driver's home in cluster deploy-mode)
  # can reach them by local path. Reuses custom-airflow's already-populated /opt/extra-jars,
  # so there's no second image to build or duplicate downloads. Runs as root to write the
  # freshly-created (root-owned) volume; curl'd jars are world-readable (644) for the worker.
  spark_jars_init:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: spark_jars_init
    user: root
    entrypoint: ["bash", "-c"]
    command: ["cp -av /opt/extra-jars/. /shared-jars/ && ls -la /shared-jars"]
    volumes:
      - spark_extra_jars:/shared-jars
    restart: "no"
    networks:
      - db_network

  # Spark Worker (official image, standalone mode)
  spark-worker-1:
    image: apache/spark:4.0.3-scala2.13-java17-python3-ubuntu
    container_name: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "4G", "--webui-port", "8081"]
    environment:
      - PYSPARK_PYTHON=python3
    depends_on:
      spark-master:
        condition: service_healthy
      # Wait until the jars are in the shared volume before the worker (and any driver it
      # hosts in cluster mode) starts, so /opt/extra-jars is populated on first use.
      spark_jars_init:
        condition: service_completed_successfully
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      # Cluster-mode driver + executors resolve the app/dependency jars from here (read-only).
      - spark_extra_jars:/opt/extra-jars:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8081), 5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - db_network

  # Redis
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - db_network

  # Orchestrator
  airflow_db:
    image: postgres:17-alpine
    container_name: airflow_db
    restart: always
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - db_network

  airflow_webserver:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    restart: always
    env_file:
      - .env
    depends_on:
      airflow_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      AIRFLOW_DB_HOST: airflow_db
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "240"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "3600"
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    cpus: "0.8"
    mem_limit: "2g"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark/jobs
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./variables.json:/opt/airflow/variables.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 150s
    command: >
      bash -c "
        /opt/airflow/init.sh &&
        airflow webserver
      "
    networks:
      - db_network

  airflow_scheduler:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    restart: always
    env_file:
      - .env
    depends_on:
      airflow_webserver:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark/jobs
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./variables.json:/opt/airflow/variables.json
    command: ["airflow", "scheduler"]
    networks:
      - db_network

  airflow_worker:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_worker
    restart: always
    env_file:
      - .env
    depends_on:
      airflow_webserver:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark/jobs
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./variables.json:/opt/airflow/variables.json
    command: ["airflow", "celery", "worker"]
    networks:
      db_network:
        # Spark rejects RPC hostnames with underscores; expose a hyphenated
        # alias the driver can advertise (spark.driver.host in the DAG).
        aliases:
          - airflow-worker

volumes:
  postgres_data:
  mysql_data:
  clickhouse_data:
  airflow_db:
  airflow_logs:
  airflow_plugins:
  # Bronze-extract + dependency jars, published by spark_jars_init, mounted into spark-worker-1
  # so cluster deploy-mode drivers/executors can reach them (Phase B2).
  spark_extra_jars:

networks:
  db_network:
    driver: bridge