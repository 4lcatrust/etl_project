services:
  # DB Sources
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    mem_limit: "1g"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/backup
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - db_network

  # DB Source #2 (MySQL OLTP) — proves multi-source ingestion via the same Scala JAR.
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    mem_limit: "1g"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - db_network

  # Mock REST API source (Phase F) — serves static JSON so the API ingestion path is
  # self-contained (no external egress). The connector fetches http://mock_api:8000/products.json.
  mock_api:
    image: python:3.12-slim
    container_name: mock_api
    mem_limit: "256m"
    working_dir: /srv
    command: ["python", "-m", "http.server", "8000"]
    volumes:
      - ./mock-api:/srv:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/products.json')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - db_network

  # DB Sink
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine 
    container_name: clickhouse_db
    mem_limit: "4g"
    cpus: "2.0"
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/clickhouse-user.xml:/etc/clickhouse-server/users.xml
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db_network

  # Storage Layer
  minio:
    image: minio/minio:latest
    container_name: minio
    mem_limit: "1g"
    entrypoint: /bin/bash -c "chmod +x /entrypoint.sh && /entrypoint.sh"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Expose the Prometheus metrics endpoints without a bearer token so the monitoring
      # profile's Prometheus can scrape /minio/v2/metrics/* over the local network.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
      - ./minio/minio-init.sh:/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - db_network


  # Spark Master (official image, standalone mode)
  spark-master:
    image: apache/spark:4.0.3-scala2.13-java17-python3-ubuntu
    container_name: spark-master
    mem_limit: "1g"
    cpus: "0.5"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      # Enable the standalone REST submission server (port 6066) so cluster deploy-mode
      # submissions (Phase B2) return a driver id that SparkSubmitOperator can poll via
      # `spark-submit --status`. spark-class honors SPARK_MASTER_OPTS for the Master class.
      - SPARK_MASTER_OPTS=-Dspark.master.rest.enabled=true
    ports:
      - "7077:7077"
      - "8000:8080"
      # 6066 (the REST submission API) is deliberately NOT published to the host: it takes an
      # arbitrary jar + class name with no authentication, so publishing it is an unauthenticated
      # RCE surface on the Spark cluster. spark_cluster's SparkSubmitOperator connection (in
      # airflow-init.sh) reaches it fine over db_network via the "spark-master" service name --
      # cluster-mode submission never needed the host port at all.
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8080), 5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - db_network

  # One-shot: publish the baked bronze-extract + dependency jars from the custom-airflow
  # image into a shared volume so spark-worker-1 (the driver's home in cluster deploy-mode)
  # can reach them by local path. Reuses custom-airflow's already-populated /opt/extra-jars,
  # so there's no second image to build or duplicate downloads. Runs as root to write the
  # freshly-created (root-owned) volume; curl'd jars are world-readable (644) for the worker.
  spark_jars_init:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: spark_jars_init
    mem_limit: "512m"
    user: root
    entrypoint: ["bash", "-c"]
    command: ["cp -av /opt/extra-jars/. /shared-jars/ && ls -la /shared-jars"]
    volumes:
      - spark_extra_jars:/shared-jars
    restart: "no"
    networks:
      - db_network

  # Spark Worker (official image, standalone mode)
  spark-worker-1:
    image: apache/spark:4.0.3-scala2.13-java17-python3-ubuntu
    container_name: spark-worker-1
    mem_limit: "5g"
    cpus: "2.0"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "4G", "--webui-port", "8081"]
    environment:
      - PYSPARK_PYTHON=python3
    depends_on:
      spark-master:
        condition: service_healthy
      # Wait until the jars are in the shared volume before the worker (and any driver it
      # hosts in cluster mode) starts, so /opt/extra-jars is populated on first use.
      spark_jars_init:
        condition: service_completed_successfully
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      # Cluster-mode driver + executors resolve the app/dependency jars from here (read-only).
      - spark_extra_jars:/opt/extra-jars:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8081), 5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - db_network

  # Redis (Celery broker). Auth required: an unauthenticated broker lets anything reaching
  # this port inject/tamper Celery tasks, which is code execution inside airflow_worker. No
  # host port publish either -- only the Airflow services (on db_network) need it.
  redis:
    image: redis:alpine
    container_name: redis
    mem_limit: "512m"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - db_network

  # Orchestrator
  airflow_db:
    image: postgres:17-alpine
    container_name: airflow_db
    mem_limit: "1g"
    restart: always
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - db_network

  airflow_webserver:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    restart: always
    env_file:
      - .env
    depends_on:
      airflow_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Show the config page but mask sensitive values (secret_key, DB URL w/ password) --
      # 'true' would expose them verbatim in the UI's Admin -> Configuration.
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'non-sensitive-only'
      # Mask secret-like Variable/Connection fields in the UI and logs (default, made explicit).
      AIRFLOW__CORE__HIDE_SENSITIVE_VAR_CONN_FIELDS: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      AIRFLOW_DB_HOST: airflow_db
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "240"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "3600"
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
      # Metrics: emit StatsD to the monitoring profile's statsd-exporter. Off unless
      # AIRFLOW_STATSD_ON=True (set it together with `--profile monitoring`).
      AIRFLOW__METRICS__STATSD_ON: ${AIRFLOW_STATSD_ON:-False}
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    cpus: "0.8"
    mem_limit: "2g"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark/jobs
      - ./dbt:/opt/airflow/dbt
      - ./docling:/opt/airflow/docling
      - ./pdf:/opt/airflow/pdf
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./variables.json:/opt/airflow/variables.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 150s
    command: >
      bash -c "
        /opt/airflow/init.sh &&
        airflow webserver
      "
    networks:
      - db_network

  airflow_scheduler:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    mem_limit: "2g"
    cpus: "1.0"
    restart: always
    env_file:
      - .env
    depends_on:
      airflow_webserver:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      # Metrics: emit StatsD to the monitoring profile's statsd-exporter. Off unless
      # AIRFLOW_STATSD_ON=True (set it together with `--profile monitoring`).
      AIRFLOW__METRICS__STATSD_ON: ${AIRFLOW_STATSD_ON:-False}
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark/jobs
      - ./dbt:/opt/airflow/dbt
      - ./docling:/opt/airflow/docling
      - ./pdf:/opt/airflow/pdf
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./variables.json:/opt/airflow/variables.json
    command: ["airflow", "scheduler"]
    networks:
      - db_network

  airflow_worker:
    image: custom-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_worker
    mem_limit: "6g"
    cpus: "2.0"
    restart: always
    env_file:
      - .env
    depends_on:
      airflow_webserver:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      # Metrics: emit StatsD to the monitoring profile's statsd-exporter. Off unless
      # AIRFLOW_STATSD_ON=True (set it together with `--profile monitoring`).
      AIRFLOW__METRICS__STATSD_ON: ${AIRFLOW_STATSD_ON:-False}
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark/jobs
      - ./dbt:/opt/airflow/dbt
      - ./docling:/opt/airflow/docling
      - ./pdf:/opt/airflow/pdf
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./variables.json:/opt/airflow/variables.json
    # Worker runs up to 4 tasks at once; the `spark` Airflow pool (2 slots) separately caps
    # concurrent client-mode Spark drivers (the ~2g memory hogs), so the extra slots serve
    # light dbt/marker tasks without letting Spark drivers stack up and OOM the host.
    command: ["airflow", "celery", "worker", "--concurrency", "4"]
    networks:
      db_network:
        # Spark rejects RPC hostnames with underscores; expose a hyphenated
        # alias the driver can advertise (spark.driver.host in the DAG).
        aliases:
          - airflow-worker

  # ---------- Observability (opt-in) ----------
  # Off by default so the base stack keeps its current footprint on a 16GB host. Start with:
  #   docker compose --profile monitoring up -d
  # Prometheus scrapes ClickHouse's native /metrics (always-on) and, when
  # AIRFLOW_STATSD_ON=True, Airflow metrics via statsd-exporter. Grafana visualizes both.
  statsd-exporter:
    image: prom/statsd-exporter:v0.27.1
    container_name: statsd_exporter
    profiles: ["monitoring"]
    mem_limit: "128m"
    command:
      - "--statsd.mapping-config=/etc/statsd/mapping.yml"
      - "--statsd.listen-udp=:9125"
      - "--web.listen-address=:9102"
    volumes:
      - ./monitoring/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    networks:
      - db_network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    profiles: ["monitoring"]
    mem_limit: "512m"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - db_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    profiles: ["monitoring"]
    mem_limit: "512m"
    environment:
      # No :-admin fallback: airflow-init.sh already refuses to boot the stack if this is
      # unset, so a bare ${GRAFANA_ADMIN_PASSWORD} here is never silently "admin".
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - db_network

volumes:
  postgres_data:
  mysql_data:
  clickhouse_data:
  airflow_db:
  airflow_logs:
  airflow_plugins:
  # Bronze-extract + dependency jars, published by spark_jars_init, mounted into spark-worker-1
  # so cluster deploy-mode drivers/executors can reach them (Phase B2).
  spark_extra_jars:
  # Monitoring profile TSDB / dashboards (only used when --profile monitoring is active).
  prometheus_data:
  grafana_data:

networks:
  db_network:
    driver: bridge